<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스마트 자동 적정 보조장치</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <main class="live-view">
      <section id="csvPanel" class="action-panel" aria-label="실험 조작">
        <div class="action-title">
          <h1>자동 적정</h1>
          <div class="mode-switcher" role="tablist" aria-label="실행 모드 선택">
            <button id="csvCollectionModeButton" class="mode-button is-active" type="button" role="tab" aria-selected="true" aria-controls="csvCollectionControls">녹화</button>
            <button id="concentrationCalculationModeButton" class="mode-button" type="button" role="tab" aria-selected="false" aria-controls="concentrationCalculatorControls">결과 계산</button>
          </div>
        </div>

        <div id="csvCollectionControls" class="main-actions csv-mode-only" aria-label="ROI와 녹화 조작">
          <button id="roiSetupButton" type="button">ROI 선택</button>
          <button id="roiAutoSetupButton" type="button" aria-pressed="false">자동 ROI OFF</button>
          <button id="roiLockButton" type="button">ROI 고정</button>
          <button id="csvStartButton" class="record-button start-button" type="button">녹화 시작</button>
          <button id="csvStopButton" class="record-button stop-button" type="button">녹화 종료</button>
          <button id="serialPumpDispenseButton" class="pump-button" type="button">펌프 주입</button>
          <button id="serialPumpRetractButton" class="pump-button" type="button">펌프 되감기</button>
          <button id="serialPumpStopButton" class="pump-button pump-stop-button" type="button">펌프 정지</button>
          <a id="csvDownloadLink" class="download-button" href="#" download="auto-titration-ml-training.csv">CSV 다운로드</a>
        </div>

        <form id="pumpTimelineForm" class="pump-settings csv-mode-only" aria-label="펌프와 이론 당량점 설정">
          <label>
            <span>유량(mL/s)</span>
            <input id="pumpRateInput" type="number" inputmode="decimal" min="0" step="0.01" value="1.00" />
          </label>
          <label>
            <span>당량점(mL)</span>
            <input id="theoryEquivalenceInput" type="number" inputmode="decimal" min="0" step="0.01" value="10.00" />
          </label>
          <label>
            <span>허용범위(mL)</span>
            <input id="equivalenceWindowInput" type="number" inputmode="decimal" min="0.001" step="0.01" value="0.05" />
          </label>
          <label class="checkbox-setting">
            <span>자동 정지</span>
            <span class="checkbox-control">
              <input id="autoStopEnabledInput" type="checkbox" />
              <strong>색 변화 후 정지</strong>
            </span>
          </label>
        </form>

        <form id="chemistryModelForm" class="pump-settings chemistry-settings" aria-label="물질과 지시약 모델 설정">
          <label>
            <span>적정 종류</span>
            <select id="titrationTypeSelect">
              <option value="strong_acid_strong_base">강산-강염기</option>
              <option value="weak_acid_strong_base" selected>약산-강염기</option>
              <option value="strong_acid_weak_base">강산-약염기</option>
              <option value="weak_acid_weak_base">약산-약염기</option>
            </select>
          </label>
          <label>
            <span>시료</span>
            <select id="sampleSubstanceInput">
              <option value="acetic acid" selected>아세트산</option>
              <option value="hydrochloric acid">염산</option>
              <option value="sodium hydroxide">수산화나트륨</option>
              <option value="ammonia">암모니아</option>
            </select>
          </label>
          <label>
            <span>시료 농도(M)</span>
            <input id="sampleConcentrationInput" type="number" inputmode="decimal" min="0.000001" step="0.001" value="0.100" />
          </label>
          <label>
            <span>시료 부피(mL)</span>
            <input id="sampleVolumeInput" type="number" inputmode="decimal" min="0.000001" step="0.01" value="10.00" />
          </label>
          <label>
            <span>표준용액</span>
            <select id="standardSolutionNameInput">
              <option value="sodium hydroxide" selected>수산화나트륨</option>
              <option value="hydrochloric acid">염산</option>
              <option value="acetic acid">아세트산</option>
              <option value="ammonia">암모니아</option>
            </select>
          </label>
          <label>
            <span>표준 농도(M)</span>
            <input id="standardConcentrationInput" type="number" inputmode="decimal" min="0" step="0.001" value="0.100" />
          </label>
          <label>
            <span>지시약</span>
            <select id="indicatorSelect">
              <option value="phenolphthalein" selected>페놀프탈레인</option>
              <option value="methyl_orange">메틸오렌지</option>
              <option value="bromothymol_blue">BTB</option>
            </select>
          </label>
        </form>

        <div id="concentrationCalculatorControls" class="calculator-panel calculator-mode-only" hidden aria-label="결과">
          <div class="result-hero" aria-label="농도와 pH 결과">
            <div class="result-card result-card-primary">
              <span>미지 시료 농도</span>
              <strong id="calcSampleConcentrationValue">-</strong>
              <small>시료</small>
            </div>
            <div class="result-card">
              <span>예측 pH</span>
              <strong id="calcPredictedPhValue">-</strong>
              <small>pH</small>
            </div>
          </div>
          <div class="result-meta" aria-label="결과 정보">
            <span>예측 당량점 <strong id="calcPredictedEquivalenceValue">-</strong></span>
            <a id="calcCsvDownloadLink" class="download-button result-download" href="#" download="auto-titration-live.csv">CSV 다운로드</a>
          </div>
          <p id="calcModeStatus" class="result-status" role="status" aria-live="polite">녹화 종료 후 계산 결과 표시</p>
        </div>

        <div id="csvStatusStrip" class="status-strip csv-mode-only" aria-label="현재 상태">
          <span id="previewStatus" class="pill" role="status" aria-live="polite">스트림 연결 중</span>
          <span id="roiSettingsStatus" class="badge">ROI 설정 대기</span>
          <span class="badge">CSV <strong id="csvStateLabel">대기</strong></span>
          <span class="badge">행 <strong id="csvRowCount">0</strong></span>
          <span class="badge">저장속도 <strong id="csvRowsPerSecondValue">0.0/s</strong></span>
          <span class="badge">펌프 <strong id="pumpCommandStatus">대기</strong></span>
          <span class="badge">자동정지 <strong id="autoStopStatus">꺼짐</strong></span>
          <span class="badge">주입 <strong id="pumpVolumeValue">-</strong></span>
          <span class="badge">농도 <strong id="calculatedConcentrationValue">-</strong></span>
          <span class="badge">pH <strong id="predictedPhValue">-</strong></span>
          <span class="badge">당량 차이 <strong id="equivalenceDistanceValue">-</strong></span>
        </div>
      </section>

      <section id="sensorGrid" class="sensor-grid" aria-label="카메라와 온도 동시 보기">
        <article class="sensor-card camera-panel">
          <div class="panel-head">
            <h2>카메라</h2>
            <span class="badge">색</span>
          </div>
          <div class="camera-frame">
            <span class="stream-placeholder">카메라 대기</span>
            <img id="visiblePreview" alt="카메라 실시간 화면" />
            <div id="visibleRoiOverlay" class="roi-overlay visible-roi-overlay" aria-hidden="true"></div>
          </div>
          <div id="visibleCandidateNotice" class="candidate-notice toast-notice is-waiting" hidden>
            <strong id="visibleCandidateNoticeTitle">ROI 선택</strong>
            <span id="visibleCandidateNoticeBody">두 화면 ROI 드래그</span>
          </div>
          <details class="details-panel">
            <summary>색상</summary>
            <div class="compact-stats" aria-label="카메라 ROI 색상 수치">
              <div class="metric rgb-r"><span>R</span><strong id="rgbRValue">-</strong></div>
              <div class="metric rgb-g"><span>G</span><strong id="rgbGValue">-</strong></div>
              <div class="metric rgb-b"><span>B</span><strong id="rgbBValue">-</strong></div>
              <div class="metric"><span>ΔRGB</span><strong id="rgbDeltaValue">-</strong></div>
              <div class="metric hsv-h"><span>H</span><strong id="hsvHValue">-</strong></div>
              <div class="metric hsv-s"><span>S</span><strong id="hsvSValue">-</strong></div>
              <div class="metric hsv-v"><span>V</span><strong id="hsvVValue">-</strong></div>
              <div class="metric hsv-delta"><span>ΔHSV</span><strong id="hsvDeltaValue">-</strong></div>
              <div class="metric wide"><span>ROI</span><strong id="visibleRoiLabel">-</strong></div>
            </div>
          </details>
        </article>

        <article class="sensor-card temperature-panel">
          <div class="panel-head">
            <h2>적외선</h2>
            <span class="badge">온도</span>
          </div>
          <div class="camera-frame thermal-frame">
            <span class="stream-placeholder">적외선 대기</span>
            <img id="thermalPreview" alt="적외선 카메라 실시간 화면" />
            <div id="thermalRoiOverlay" class="roi-overlay thermal-roi-overlay" aria-hidden="true"></div>
            <button id="mini2RotateButton" class="frame-icon-button thermal-rotate-button" type="button" aria-label="적외선 180° 회전" title="적외선 180° 회전">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <path d="M21 3v6h-6" />
              </svg>
              <span class="sr-only" data-rotate-label>적외선 180° 회전</span>
            </button>
          </div>
          <div class="temperature-value"><strong id="temperatureValue">--.-</strong><span id="temperatureUnit">raw</span></div>
          <details class="details-panel">
            <summary>온도</summary>
            <div class="compact-stats">
              <div class="metric"><span>최소</span><strong id="temperatureMin">-</strong></div>
              <div class="metric"><span>최대</span><strong id="temperatureMax">-</strong></div>
              <div class="metric"><span>변화</span><strong id="temperatureDelta">-</strong></div>
              <div class="metric"><span>상태</span><strong id="statusLabel">-</strong></div>
              <div class="metric wide"><span>ROI</span><strong id="thermalRoiLabel">-</strong></div>
              <div class="metric wide diagnostic-metric">
                <span>진단</span>
                <strong id="mini2DebugLabel">-</strong>
                <button id="mini2CopyDiagnosticButton" class="inline-utility-button" type="button">진단 복사</button>
                <textarea id="mini2FullDiagnosticText" hidden readonly></textarea>
              </div>
            </div>
          </details>
        </article>
      </section>

    </main>
  </div>

  <script>
    if (window.AutoTitrationAndroid) window.AUTO_TITRATION_STREAM_BASE = '.';
  </script>
  <script src="app.js"></script>
  <script src="android-webview.js"></script>
</body>
</html>
